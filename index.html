<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng May 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed isometric diorama canvas; game HUD floats over it (brand+stats top, directory left, info card right, minimap + toolbar bottom). Single committed look. */
:root{
  --sky-top:#bfe1ec; --sky-bot:#eaf2df;
  --panel:#1b2636; --panel-2:#243349; --edge:#33465f; --text:#f2f5f9; --muted:#9db0c7;
  --safety:#ffd23f; --safety-dk:#c99a00; --coral:#f29c74; --exit:#3ddc84; --alarm:#ff5a5f;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));color:var(--text);font-family:var(--body);font-size:14px}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing} #c.hover{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:600 11px/1.15 var(--body);color:#1b2636;background:#ffffffe6;border:1.5px solid #1b263622;padding:2px 7px;border-radius:7px;box-shadow:0 2px 0 #1b26361f;will-change:transform}
.lbl small{display:block;font-size:9.5px;font-weight:500;color:#5b6b80}
.lbl.major{font:700 13px/1.1 var(--display);padding:3px 9px 1px;background:var(--panel);color:var(--text);border-color:#0000;box-shadow:0 3px 0 #0b1220}
.lbl.major small{color:var(--muted)}
.lbl.line{font:700 10px/1 var(--mono);background:var(--coral);color:#3b1a0c;padding:3px 5px;border:0}
.lbl.exit{font:800 11px/1 var(--display);background:var(--exit);color:#06361c;padding:4px 7px 2px;border:0;box-shadow:0 3px 0 #1e8f52;letter-spacing:.04em}
.lbl.sel{outline:2px solid var(--safety);outline-offset:2px}

.panel{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 6px 0 #0b1220aa,0 18px 40px #0b122040}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--safety);display:grid;place-items:center;box-shadow:inset 0 -3px 0 var(--safety-dk)}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:800 22px/1 var(--display);letter-spacing:.01em}
#stats{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:6px 11px 5px;box-shadow:0 4px 0 #0b1220aa;display:flex;flex-direction:column;min-width:64px}
.chip b{font:800 19px/1 var(--display);font-variant-numeric:tabular-nums}
.chip span{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.chip.y b{color:var(--safety)} .chip.g b{color:var(--exit)} .chip.c b{color:var(--coral)}

#dir{top:calc(76px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:264px;bottom:calc(208px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
#dir .hd{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--edge)}
#dir h2{margin:0;font:700 16px/1 var(--display)}
.xp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.xp .bar{flex:1;height:8px;border-radius:6px;background:#0e1724;overflow:hidden;border:1px solid var(--edge)}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--safety),var(--coral));width:0;transition:width .4s}
.rank{font:700 11px/1 var(--display);color:var(--panel);background:var(--safety);padding:3px 7px 1px;border-radius:6px}
#q{width:100%;box-sizing:border-box;background:#0e1724;border:1px solid var(--edge);color:var(--text);border-radius:9px;padding:7px 10px;font:500 13px var(--body)}
#q:focus{outline:2px solid var(--safety);outline-offset:1px}
#list{overflow:auto;padding:6px 8px 12px;flex:1;min-height:0}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px;display:flex;align-items:center;gap:6px}
.grp i{width:9px;height:9px;border-radius:3px;display:inline-block}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--text);font:500 13px var(--body);padding:6px 8px;border-radius:8px;cursor:pointer}
.it:hover,.it:focus-visible{background:var(--panel-2);outline:none}
.it.on{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--safety)}
.it .v{margin-left:auto;font-size:11px;color:var(--exit)}
.lines{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:2px 4px}
.ln{font:700 12px var(--mono);background:var(--panel-2);border:0;border-bottom:3px solid #0e1724;color:var(--text);border-radius:7px;padding:6px 0 4px;cursor:pointer}
.ln:hover,.ln:focus-visible,.ln.on{background:var(--coral);color:#3b1a0c;outline:none}
.ln.v{box-shadow:inset 0 -2px 0 var(--exit)}

#card{top:calc(76px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:300px;padding:14px;max-height:calc(100% - 300px);overflow:auto;box-sizing:border-box}
#card .cat{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#card .cat i{width:10px;height:10px;border-radius:3px}
#card h3{margin:6px 0 2px;font:800 22px/1.1 var(--display);text-wrap:balance}
#card .zh{color:var(--muted);font-size:13px}
#card p{color:#cfd9e6;line-height:1.55;margin:10px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#0e1724;border:1px solid var(--edge);border-radius:10px;padding:8px 10px;min-width:0}
.kv b{display:block;font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--muted)}
.eff{height:12px;border-radius:7px;background:#0e1724;border:1px solid var(--edge);overflow:hidden}
.eff i{display:block;height:100%}
.pill{display:inline-block;font:700 11px/1 var(--display);padding:4px 8px 2px;border-radius:999px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{font:700 13px/1 var(--display);padding:9px 12px 7px;border-radius:10px;border:0;cursor:pointer;background:var(--panel-2);color:var(--text);border-bottom:3px solid #0e1724;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
.btn.y{background:var(--safety);color:#2a2000;border-bottom-color:var(--safety-dk)}
.btn.r{background:var(--alarm);color:#fff;border-bottom-color:#b02a2f}
.btn.on{background:#3a5272;box-shadow:inset 0 0 0 2px var(--safety)}
.btn svg{width:16px;height:16px}

#mini{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px;width:264px;box-sizing:border-box}
#mini .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 2px 6px;display:flex;justify-content:space-between}
#mm{width:100%;height:150px;display:block;border-radius:8px;cursor:crosshair;background:#7fb276}
#bar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 590px)}
.sep{width:1px;background:var(--edge);margin:2px 2px}
#hint{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:#1b2636;background:#ffffffcc;padding:6px 9px;border-radius:8px;line-height:1.5;max-width:150px}
#drillHud{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--alarm);color:#fff;border-radius:14px;padding:10px 18px 8px;text-align:center;box-shadow:0 5px 0 #8f1f24;font-family:var(--display)}
#drillHud .big{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
#drillHud .s{font:600 12px var(--body);opacity:.9}
#drillHud .stars{font-size:22px;letter-spacing:4px;color:var(--safety)}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 30px #ff2a2a00}
#vig.on{animation:al 1s infinite}
@keyframes al{50%{box-shadow:inset 0 0 160px 30px #ff2a2a66}}
#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--text);font:600 12px var(--body);padding:5px 9px;border-radius:8px;border:1px solid var(--edge);transform:translate(12px,12px)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:700 18px var(--display);color:#1b2636}
#dirToggle{display:none}
@media (max-width:1100px){#hint{display:none}#bar{max-width:calc(100% - 310px);left:auto;right:calc(12px + env(safe-area-inset-right,0px));transform:none}}
@media (max-width:720px){
  #dir{display:none;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:auto;right:calc(12px + env(safe-area-inset-right,0px))}
  #dir.open{display:flex}
  #dirToggle{display:inline-flex}
  #mini{display:none}
  #bar{left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));max-width:none}
  #card{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));width:auto;max-height:42vh}
  #stats{top:calc(70px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));right:auto;max-width:none;justify-content:flex-start}
  .chip{min-width:0;padding:4px 8px 3px}.chip b{font-size:15px}
  #drillHud{top:calc(128px + env(safe-area-inset-top,0px))}
  .lbl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){#vig.on{animation:none;box-shadow:inset 0 0 120px 20px #ff2a2a55}}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Mô hình 3D xưởng may"></canvas>
  <div id="labels"></div>
  <div id="vig"></div>
  <div id="loading">Đang dựng xưởng…</div>

  <header id="brand" class="panel">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2a2000" stroke-width="2.2" stroke-linecap="round"><path d="M4 20 19 5"/><circle cx="20.2" cy="3.8" r="1.6"/><path d="M8 20c3-1 4-5 8-6"/></svg>
    </div>
    <div><div class="eyebrow">平面圖 · Tầng 1 · 第1頁</div><h1>Xưởng May 3D</h1></div>
  </header>

  <div id="stats">
    <div class="chip c"><b>25</b><span>Chuyền may</span></div>
    <div class="chip"><b id="sWorkers">0</b><span>Công nhân</span></div>
    <div class="chip y"><b id="sZones">0</b><span>Khu vực</span></div>
    <div class="chip g"><b>8</b><span>Lối thoát</span></div>
  </div>

  <aside id="dir" class="panel" aria-label="Danh sách khu vực">
    <div class="hd">
      <h2>Bản đồ khu vực</h2>
      <div class="xp"><span class="rank" id="rank">Tân binh</span><div class="bar"><i id="xpbar"></i></div><span id="xptxt">0/0</span></div>
      <input id="q" type="search" placeholder="Tìm khu vực, chuyền…" autocomplete="off">
    </div>
    <div id="list"></div>
  </aside>

  <aside id="card" class="panel" hidden aria-live="polite"></aside>

  <div id="mini" class="panel"><div class="t"><span>Sơ đồ mặt bằng</span><span>Bấm để bay tới</span></div><canvas id="mm"></canvas></div>

  <nav id="bar" class="panel" aria-label="Điều khiển">
    <button class="btn" id="dirToggle" type="button">☰ Khu vực</button>
    <button class="btn" id="rotL" type="button" title="Xoay trái 90°" aria-label="Xoay trái"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 3v5h5"/></svg></button>
    <button class="btn" id="rotR" type="button" title="Xoay phải 90°" aria-label="Xoay phải"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 3v5h-5"/></svg></button>
    <button class="btn" id="home" type="button">Toàn cảnh</button>
    <button class="btn" id="top" type="button">Nhìn từ trên</button>
    <span class="sep"></span>
    <button class="btn on" id="tAisle" type="button">Lối đi</button>
    <button class="btn on" id="tLbl" type="button">Nhãn</button>
    <button class="btn on" id="tWork" type="button">Công nhân</button>
    <button class="btn on" id="tRoof" type="button">Mái nhà</button>
    <span class="sep"></span>
    <button class="btn r" id="drill" type="button">Diễn tập thoát hiểm</button>
  </nav>
  <div id="hint">Kéo trái: di chuyển<br>Kéo phải / Ctrl: xoay<br>Cuộn: phóng to</div>
  <div id="drillHud" hidden></div>
  <div id="tip" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{

function select(z,fly=true){const o=selected;selected=z;setEm(o);
  LBL.forEach(L=>L.el.classList.toggle('sel',!!z&&L.zone===z));
  document.querySelectorAll('[data-z]').forEach(b=>b.classList.toggle('on',!!z&&b.dataset.z===z.id));
  if(!z){card.hidden=true;ring.position.y=-50;return}
  setEm(z);gem.position.set(z.R.cx,z.gy,z.R.cz);ring.position.set(z.R.cx,(z.gb?YARD+.07:F)+.15,z.R.cz);
  const isNew=!visited.has(z.id);visited.add(z.id);try{localStorage.setItem('xm3d-visited',JSON.stringify([...visited]))}catch(e){}
  renderCard(z,isNew);updateXP();markVisited();
  if(fly){goal.tx=z.R.cx;goal.tz=z.R.cz;goal.zoom=Math.max(goal.zoom,z.line?2.6:Math.min(3.2,Math.max(1.6,50/Math.max(z.R.w,z.R.d))))}
}
function renderCard(z,isNew){const c=CAT[z.cat];let h=`<div class="cat"><i style="background:${c.c}"></i>${c.n}${isNew?' · <span style="color:var(--safety)">+10 XP khám phá</span>':''}</div>
  <h3>${z.vi}</h3>${z.zh?`<div class="zh">${z.zh}</div>`:''}<p>${z.d}</p>`;
  if(z.line){const d=lineData(z.line.n),n=z.line.n===24?8:12;
    h+=`<div class="row" style="margin-top:0;align-items:center;justify-content:space-between"><span class="pill" style="background:${d.st[1]};color:${d.st[2]}">${d.st[0]}</span><span style="font:600 12px var(--mono);color:var(--muted)">${d.code}</span></div>
    <div class="kv"><div><b>${d.out.toLocaleString('vi-VN')}</b><span>Sản lượng hôm nay (sp)</span></div><div><b>${d.target}</b><span>Mục tiêu / giờ</span></div>
    <div><b>${n}</b><span>Công nhân trên chuyền</span></div><div><b style="font-size:14px;line-height:1.3">${d.style}</b><span>Mã hàng đang may</span></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>Hiệu suất</span><b style="color:var(--text)">${d.eff}%</b></div>
    <div class="eff"><i style="width:${d.eff}%;background:${d.st[1]}"></i></div>
    <div class="note">Số liệu minh họa, chưa kết nối hệ thống sản xuất.</div>`}
  h+=`<div class="row"><button class="btn y" id="cFly" type="button">Bay tới</button><button class="btn" id="cClose" type="button">Đóng</button></div>`;
  card.innerHTML=h;card.hidden=false;
  $('#cFly').onclick=()=>select(z,true);$('#cClose').onclick=()=>select(null);}
function updateXP(){const v=visited.size;let i=0;while(i<RANKS.length-1&&v>=RANKS[i+1][0])i++;
  const a=RANKS[i][0],b=RANKS[Math.min(i+1,RANKS.length-1)][0];$('#rank').textContent=RANKS[i][1];
  $('#xpbar').style.width=(b>a?(v-a)/(b-a)*100:100)+'%';$('#xptxt').textContent=v+'/'+Z.length}
function markVisited(){document.querySelectorAll('[data-z]').forEach(b=>{const v=visited.has(b.dataset.z);b.classList.toggle('v',v);const s=b.querySelector('.v');if(s)s.textContent=v?'✓':''})}

function buildList(q=''){q=q.trim().toLowerCase();const L=$('#list');let h='';
  const m=z=>!q||(z.vi+' '+z.zh+' '+z.id).toLowerCase().includes(q);
  const lines=Z.filter(z=>z.line&&m(z));
  if(lines.length)h+=`<div class="grp"><i style="background:${CAT.sewing.c}"></i>Chuyền may · 縫製線</div><div class="lines">`+lines.map(z=>`<button class="ln" type="button" data-z="${z.id}" title="${z.vi}">${z.line.n}</button>`).join('')+'</div>';
  ['sewing',...CAT_ORDER].forEach(c=>{const zs=Z.filter(z=>z.cat===c&&!z.line&&m(z));if(!zs.length)return;
    h+=`<div class="grp"><i style="background:${CAT[c].c}"></i>${CAT[c].n}</div>`+zs.map(z=>`<button class="it" type="button" data-z="${z.id}">${z.vi}<span class="v"></span></button>`).join('')});
  L.innerHTML=h||'<p style="color:var(--muted);padding:8px">Không tìm thấy khu vực nào khớp.</p>';
  L.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{select(ZI[b.dataset.z]);if(innerWidth<=720)$('#dir').classList.remove('open')});
  markVisited();if(selected)L.querySelectorAll(`[data-z="${selected.id}"]`).forEach(b=>b.classList.add('on'))}
$('#q').addEventListener('input',e=>buildList(e.target.value));
buildList();updateXP();
$('#sZones').textContent=Z.length;$('#sWorkers').textContent=W.length;

const Q=Math.PI/4;
$('#rotL').onclick=()=>goal.theta=Math.round((goal.theta+2*Q)/Q)*Q;
$('#rotR').onclick=()=>goal.theta=Math.round((goal.theta-2*Q)/Q)*Q;
$('#home').onclick=()=>{const tw=2*Math.PI;Object.assign(goal,HOME,{zoom:fitZoom(),theta:HOME.theta+Math.round((goal.theta-HOME.theta)/tw)*tw});$('#top').classList.remove('on')};
$('#top').onclick=e=>{const on=goal.phi<1.3;goal.phi=on?1.45:HOME.phi;e.currentTarget.classList.toggle('on',on)};
const tog=(id,fn)=>$(id).onclick=e=>{const b=e.currentTarget;b.classList.toggle('on');fn(b.classList.contains('on'))};
let showW=true;
tog('#tAisle',v=>aisleGroup.visible=v);tog('#tLbl',v=>showLbl=v);tog('#tWork',v=>showW=v);tog('#tRoof',v=>showRoof=v);
$('#dirToggle').onclick=()=>$('#dir').classList.toggle('open');

// evacuation drill
const drill={on:false,t:0,done:0,fin:false},dh=$('#drillHud');
function startDrill(){if(drill.on)return resetDrill();
  Object.assign(drill,{on:true,t:0,done:0,fin:false});showW=true;$('#tWork').classList.add('on');
  W.forEach(w=>{w.path=w.pathPx.map(([x,y])=>[wx(x),wz(y)]);w.pi=1;w.out=false;w.counted=false;w.x=w.bx;w.z=w.bz});
  Object.assign(goal,{zoom:fitZoom(),tx:HOME.tx,tz:HOME.tz});select(null);
  $('#vig').classList.add('on');$('#drill').textContent='Kết thúc diễn tập';dh.hidden=false;}
function resetDrill(){drill.on=false;drill.fin=false;W.forEach(w=>{w.x=w.bx;w.z=w.bz;w.out=false});$('#vig').classList.remove('on');dh.hidden=true;$('#drill').textContent='Diễn tập thoát hiểm';alarmLight.intensity=0}
$('#drill').onclick=startDrill;
function stepDrill(dt){if(!drill.on||drill.fin)return;drill.t+=dt;
  W.forEach(w=>{if(w.out)return;let rem=w.sp*dt;
    while(rem>0&&w.pi<w.path.length){const [tx,tz]=w.path[w.pi],dx=tx-w.x,dz=tz-w.z,d=Math.hypot(dx,dz);
      if(d<=rem){w.x=tx;w.z=tz;rem-=d;if(w.pi>=w.ei&&!w.counted){w.counted=true;drill.done++}w.pi++}else{w.x+=dx/d*rem;w.z+=dz/d*rem;rem=0}}
    if(w.pi>=w.path.length){w.out=true;if(!w.counted){w.counted=true;drill.done++}}});
  const tt=drill.t.toFixed(1);
  if(drill.done>=W.length){drill.fin=true;$('#vig').classList.remove('on');alarmLight.intensity=0;
    const st=drill.t<=20?3:drill.t<=28?2:1;
    dh.innerHTML=`<div class="s">Hoàn thành diễn tập</div><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="big">${tt}s</div><div class="s">${W.length}/${W.length} người đã ra khỏi xưởng</div>`;
  }else dh.innerHTML=`<div class="s">Diễn tập thoát hiểm · đang sơ tán</div><div class="big">${tt}s</div><div class="s">Đã thoát: ${drill.done}/${W.length}</div>`;
}

// minimap
const mm=$('#mm'),mctx=mm.getContext('2d');let mmS=1,mmBase=null;
const MX0=-320,MY0=-40,MW=1760,MH=930;
function sizeMini(){const r=mm.getBoundingClientRect();if(!r.width)return;const d=Math.min(devicePixelRatio,2);mm.width=r.width*d;mm.height=r.height*d;mmS=Math.min(mm.width/MW,mm.height/MH);
  const c=document.createElement('canvas');c.width=mm.width;c.height=mm.height;const g=c.getContext('2d');
  const ox=(mm.width-MW*mmS)/2,oy=(mm.height-MH*mmS)/2;mmBase={c,ox,oy,d};
  const R=(x1,y1,x2,y2,col)=>{g.fillStyle=col;g.fillRect(ox+(x1-MX0)*mmS,oy+(y1-MY0)*mmS,(x2-x1)*mmS,(y2-y1)*mmS)};
  g.fillStyle='#7fb276';g.fillRect(0,0,c.width,c.height);R(-240,-40,-115,970,'#6f767e');R(-102,842,1428,900,'#7b828b');R(-100,-35,80,838,'#c4c7ca');
  R(80,25,1278,795,'#e5e2db');R(1325,25,1385,860,'#e5e2db');
  Z.forEach(z=>R(...z.r,CAT[z.cat].c));AISLES.forEach(a=>R(...a,'#ffd23f'));
  EXITS.forEach(e=>{g.fillStyle='#14a85a';g.beginPath();g.arc(ox+(e.x-MX0)*mmS,oy+(e.y-MY0)*mmS,4*d,0,7);g.fill()});}
function drawMini(){if(!mmBase)return;const g=mctx,d=mmBase.d;g.clearRect(0,0,mm.width,mm.height);g.drawImage(mmBase.c,0,0);
  const cx=mmBase.ox+((view.tx*S+OX)-MX0)*mmS,cy=mmBase.oy+((view.tz*S+OY)-MY0)*mmS;
  if(drill.on){g.fillStyle='#d62828';W.forEach((w,i)=>{if(i%2)return;g.fillRect(mmBase.ox+((w.x*S+OX)-MX0)*mmS-d,mmBase.oy+((w.z*S+OY)-MY0)*mmS-d,2*d,2*d)})}
  g.save();g.translate(cx,cy);g.rotate(-view.theta);g.fillStyle='#1b2636';g.strokeStyle='#ffffff';g.lineWidth=1.5*d;
  g.beginPath();g.moveTo(0,-9*d);g.lineTo(6*d,6*d);g.lineTo(0,3*d);g.lineTo(-6*d,6*d);g.closePath();g.fill();g.stroke();g.restore();}
mm.addEventListener('click',e=>{if(!mmBase)return;const r=mm.getBoundingClientRect(),d=mm.width/r.width;const px=((e.clientX-r.left)*d-mmBase.ox)/mmS+MX0,py=((e.clientY-r.top)*d-mmBase.oy)/mmS+MY0;goal.tx=wx(px);goal.tz=wz(py);goal.zoom=Math.max(goal.zoom,1.8);clampT()});

// loop
resize();HOME.zoom=fitZoom();Object.assign(view,HOME);Object.assign(goal,HOME);applyCam();
$('#loading').remove();
let tPrev=performance.now(),T=0;
function frame(now){const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;T+=dt;
  const k=RM?1:1-Math.pow(.0015,dt);for(const key of ['tx','tz','zoom','theta','phi'])view[key]+=(goal[key]-view[key])*k;
  applyCam();stepDrill(dt);
  if(drill.on&&!drill.fin){alarmLight.intensity=.8+Math.sin(T*8)*.6;exitMat.emissiveIntensity=1+Math.sin(T*8)*.8}
  else exitMat.emissiveIntensity=.5+(RM?0:Math.sin(T*2)*.15);
  exitArrows.forEach((a,i)=>a.position.y=3.4+(RM?0:Math.sin(T*3+i)*.25));
  gem.rotation.y+=dt*1.6;gem.position.y=selected?selected.gy+(RM?0:Math.sin(T*3)*.25):-50;
  ROOFS.forEach(r=>{const tg=(!showRoof||r.z===selected)?1:0;r.lift+=(tg-r.lift)*(RM?1:Math.min(1,dt*5));r.g.position.y=r.lift*5;r.mats.forEach(m=>m.opacity=1-r.lift*.85);r.g.visible=r.lift<.97});
  if(!RM){const p=fgeo.attributes.position;for(let i=0;i<p.count;i++){const x=fx0[i];p.setZ(i,Math.sin(x*2.4-T*5)*.14*x/2)}p.needsUpdate=true}ring.scale.setScalar(1+(RM?0:((T*.8)%1)*.25));
  if(!RM)carts.forEach(c=>{c.t=(c.t+dt*.035)%2;const u=c.t<1?c.t:2-c.t,[a,b]=c.path;c.g.position.set(a[0]+(b[0]-a[0])*u,0,a[1]+(b[1]-a[1])*u);c.g.rotation.y=Math.atan2(-(b[1]-a[1]),b[0]-a[0])+(c.t<1?0:Math.PI)});
  drawWorkers(T,showW);
  renderer.render(scene,camera);drawLabels();drawMini();
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
